name: RedCap
description: RedCap is an automotive dealer service software company that built an on-demand vehicle
  pickup-and-delivery, loaner, and shuttle platform for dealership fixed-operations (service) departments
  — offering live vehicle tracking, automated dispatching, at-home loaner contracting, on-demand parts
  fulfillment, and Uber-integrated shuttle coordination that plug into a dealership's existing DMS and
  service tools. Backed by Uncork Capital, RedCap was acquired by Solera and is now operated as Solera
  Service Suite; its former site (getredcap.com) redirects to the Solera Service Suite product. RedCap
  does not publish a public developer API, OpenAPI, or developer portal.
